name: Breaking Changes Detection

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main, master]
    paths:
      - 'apps/**/api/**'
      - 'packages/**/src/**'
      - 'package.json'
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PNPM_VERSION: 9

jobs:
  detect-breaking-changes:
    name: Detect Breaking Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for breaking changes in API routes
        run: |
          echo "Checking for breaking API changes..."
          
          # Check if API routes were deleted or renamed
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            DELETED_ROUTES=$(git diff --name-only --diff-filter=D $BASE_SHA $HEAD_SHA | grep -E 'apps/.*/api/.*route\.ts' || true)
            
            if [ -n "$DELETED_ROUTES" ]; then
              echo "::warning::Potentially breaking change: API routes deleted"
              echo "$DELETED_ROUTES"
              echo "BREAKING_CHANGES=true" >> $GITHUB_ENV
            fi
            
            # Check for route method changes
            CHANGED_ROUTES=$(git diff --name-only --diff-filter=M $BASE_SHA $HEAD_SHA | grep -E 'apps/.*/api/.*route\.ts' || true)
            
            if [ -n "$CHANGED_ROUTES" ]; then
              echo "Changed API routes detected - manual review recommended"
              echo "$CHANGED_ROUTES"
            fi
          fi
        continue-on-error: true

      - name: Check package.json for major version bumps
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            # Check if dependencies were updated to major versions
            git diff $BASE_SHA $HEAD_SHA -- package.json pnpm-lock.yaml | grep -E '^\+.*"[0-9]+\.' | while read line; do
              if echo "$line" | grep -qE '"[0-9]+\.[0-9]+\.[0-9]+"'; then
                VERSION=$(echo "$line" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
                MAJOR=$(echo "$VERSION" | cut -d. -f1)
                if [ "$MAJOR" -gt 0 ]; then
                  echo "::warning::Major version dependency update detected: $line"
                  echo "BREAKING_CHANGES=true" >> $GITHUB_ENV
                fi
              fi
            done || true
          fi
        continue-on-error: true

      - name: Comment on PR if breaking changes detected
        if: env.BREAKING_CHANGES == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Breaking Changes Detected**\n\nThis PR appears to contain breaking changes. Please:\n\n1. Update the changelog\n2. Consider versioning (major version bump)\n3. Document migration path for users\n4. Add breaking change label if intentional'
            });
