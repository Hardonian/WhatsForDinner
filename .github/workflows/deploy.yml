env:
  NODE_VERSION: '22'
  PNPM_VERSION: 9

jobs:
  deploy-production:
    name: Deploy to Production (DEPRECATED)
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SITE_URL: https://${{ secrets.VERCEL_PROJECT_DOMAIN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

            - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:

- name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm run build:web

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Supabase Login & Link
        run: |
          pnpm run supa:login || echo "Supabase login skipped if token not available"
          pnpm run supa:link || echo "Supabase link skipped if not configured"
        continue-on-error: true

      - name: Apply Supabase Migrations (Prod)
        run: |
          pnpm run supa:migrate:apply || echo "Migrations skipped if not configured"
        continue-on-error: true

      - name: Vercel Pull & Build
        run: |
          pnpm run vercel:pull || echo "Vercel pull skipped if not configured"
          pnpm run vercel:build || echo "Vercel build skipped if not configured"
        continue-on-error: true

      - name: Deploy to Vercel (Production)
        run: pnpm run vercel:deploy:prod || echo "Vercel deploy skipped if not configured"
        continue-on-error: true
