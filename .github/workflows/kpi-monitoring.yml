name: KPI Monitoring

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  kpi-alerts:
    name: Check KPIs and Send Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run KPI alert checker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          KPI_ALERT_EMAILS: ${{ secrets.KPI_ALERT_EMAILS }}
        run: |
          pnpm tsx scripts/monitoring/kpi-alert-runner.ts

      - name: Report results
        if: always()
        run: |
          echo "KPI monitoring completed"
