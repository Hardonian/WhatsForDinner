name: Weekly System Health & Solution Sweep
on:
  schedule:
    - cron: '30 7 * * MON'  # Monday 07:30 UTC (02:30 America/Toronto)
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Install deps
        run: npm ci || true
      - name: Run System Health Generator
        run: tsx scripts/agents/system_health.ts || true
      - name: Commit System Health Report
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/system_health_*.md || true
          git commit -m "chore: update system health report" || true
          git push || true
