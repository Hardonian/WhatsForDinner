name: Unified Agent Runner

on:
  schedule:
    # Run every 12 hours at :05 (light maintenance)
    - cron: "0 6 * * 1"  # weekly Mon 06:00 UTC
  workflow_dispatch:
    # Allow manual triggering
  push:
    branches:
      - main
      - develop
    paths:
      - 'agents/**'
      - '.cursor/config/master-agent.json'
      - 'package.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Run Unified Agent System
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for git log analysis

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unified Agent
        run: pnpm agent:run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit agent artifacts
        if: github.event_name == 'schedule'
        run: |
          git config --local user.email "agent@hardonia.dev"
          git config --local user.name "Unified Agent"
          git add admin/ security/ roadmap/ auto/ docs/intent-log.md .cursor/
          git diff --staged --quiet || git commit -m "🤖 Agent cycle: autonomous improvements and monitoring"
          git push || echo "No changes to commit"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-artifacts
          path: |
            admin/*.json
            admin/*.md
            security/*.json
            roadmap/*.md
            auto/*.md
            .cursor/agent-discoveries.md
          retention-days: 30
