name: Nightly Jobs

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PNPM_VERSION: 9

jobs:
  drift-report:
    name: Architectural Drift Report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

            - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

- name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Architectural Guardrails
        run: |
          if [ -f "./infra/selfcheck/validate-guardrails.sh" ]; then
            ./infra/selfcheck/validate-guardrails.sh > guardrails-report.txt 2>&1 || true
          else
            echo "Guardrails script not found, skipping..."
          fi
        continue-on-error: true

      - name: Detect Architectural Drift
        run: |
          if [ -f "infra/selfcheck/detect-drift.js" ]; then
            node infra/selfcheck/detect-drift.js > drift-report.txt 2>&1 || true
          else
            echo "Drift detection script not found, skipping..."
          fi
        continue-on-error: true

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ github.run_number }}
          path: |
            guardrails-report.txt
            drift-report.txt
          retention-days: 30
          if-no-files-found: ignore

  code-hygiene-deep:
    name: Deep Code Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check unused exports
        run: pnpm prune:exports > reports/ts-prune.txt || echo "ts-prune skipped"
        continue-on-error: true

      - name: Scan for unused files
        run: pnpm scan:usage || echo "knip skipped"
        continue-on-error: true

      - name: Audit dependencies
        run: pnpm audit:deps || echo "depcheck skipped"
        continue-on-error: true

      - name: Upload hygiene reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hygiene-reports-nightly
          path: reports/*.json
          retention-days: 30
          if-no-files-found: ignore

  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lighthouse CI
        run: |
          if command -v lhci &> /dev/null || npm list -g @lhci/cli &> /dev/null; then
            lhci autorun --config=.lighthouserc.js || echo "Lighthouse CI completed with warnings"
          else
            echo "Lighthouse CI not available, skipping..."
          fi
        continue-on-error: true
        env:
          DEPLOY_URL: ${{ secrets.PROD_URL || 'http://localhost:3000' }}

      - name: Upload benchmarks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmarks
          path: |
            .lighthouseci/**
            REPORTS/lighthouse.json
          retention-days: 30
          if-no-files-found: ignore
