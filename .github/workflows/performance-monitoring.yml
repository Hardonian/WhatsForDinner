name: Performance Monitoring

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  performance-check:
    name: Performance Budget Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build:web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}

      - name: Analyze bundle size
        run: |
          pnpm analyze:bundle || echo "Bundle analysis skipped"
        continue-on-error: true

      - name: Check performance budgets
        run: |
          pnpm performance:budget || echo "Performance budget check skipped"
        continue-on-error: true

      - name: Run Lighthouse CI
        run: |
          pnpm lhci || echo "Lighthouse CI skipped"
        continue-on-error: true

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: |
            REPORTS/lighthouse.json
            REPORTS/bundle-report.json
          retention-days: 7
          if-no-files-found: ignore
