name: Reliability Orchestrator

on:
  schedule:
    # Run weekly to control orchestration cost.
    - cron: '0 6 * * 1'  # weekly Mon 06:00 UTC
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Run checks only (no PRs)'
        required: false
        default: 'false'
        type: boolean
      no_prs:
        description: 'Skip PR generation'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Reliability, Financial, and Security Orchestration
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Run Reliability Orchestrator
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MONTHLY_BUDGET: ${{ secrets.MONTHLY_BUDGET }}
          HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL }}
          VERCEL_PROJECT_DOMAIN: ${{ secrets.VERCEL_PROJECT_DOMAIN }}
          RELIABILITY_ALERT_WEBHOOK: ${{ secrets.RELIABILITY_ALERT_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.check_only }}" == "true" ]; then
            pnpm run reliability:check
          elif [ "${{ github.event.inputs.no_prs }}" == "true" ]; then
            pnpm run reliability:dashboard
          else
            pnpm run reliability:orchestrate
          fi

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-reports
          path: |
            REPORTS/dependency-report.json
            REPORTS/cost_forecast.json
            REPORTS/reliability_trends.json
            compliance/audits/**/SECURITY_COMPLIANCE_REPORT.json
            apps/web/public/admin/reliability.json
            apps/web/public/admin/compliance.json
          retention-days: 30

      - name: Comment on PR (if PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              const reliabilityJson = fs.readFileSync('apps/web/public/admin/reliability.json', 'utf8');
              const reliability = JSON.parse(reliabilityJson);
              
              const comment = `## Reliability Orchestrator Report
              
              **Overall Status**: ${reliability.overall.status.toUpperCase()}
              **Score**: ${reliability.overall.score}/100
              
              ### Uptime
              - ${(reliability.uptime.percentage * 100).toFixed(3)}% (target: ${(reliability.uptime.target * 100).toFixed(2)}%)
              - Avg Latency: ${reliability.uptime.avgLatency}ms
              
              ### Dependencies
              - Outdated: ${reliability.dependencies.outdated}
              - Vulnerabilities: ${reliability.dependencies.vulnerabilities}
              
              ### Costs
              - Current: $${reliability.costs.current.toFixed(2)}/month
              - Forecasted: $${reliability.costs.forecasted.toFixed(2)}/month
              
              [View Full Dashboard](./apps/web/public/admin/reliability.json)
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Could not post comment:', error.message);
            }

      - name: Create Issue for Critical Alerts
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const TITLE = '🚨 Reliability Orchestrator Failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The reliability orchestrator workflow failed. Please check the workflow logs for details.\n\nWorkflow Run: ${runUrl}`;

            // Reuse a single tracking issue instead of filing a fresh one on every
            // failure. The previous unconditional `issues.create()` generated 859
            // duplicate "critical" issues, which made triage impossible.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'reliability',
              per_page: 100
            });
            const existing = open.find(
              (i) => i.title === TITLE && !i.pull_request
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Orchestrator failed again.\n\n${body}`
              });
              core.info(`Reused existing tracking issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITLE,
                body,
                labels: ['reliability', 'critical']
              });
              core.info('Created new tracking issue');
            }
