name: Reliability Orchestrator

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Run checks only (no PRs)'
        required: false
        default: 'false'
        type: boolean
      no_prs:
        description: 'Skip PR generation'
        required: false
        default: 'false'
        type: boolean

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    name: Reliability, Financial, and Security Orchestration
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Run Reliability Orchestrator
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MONTHLY_BUDGET: ${{ secrets.MONTHLY_BUDGET || '75' }}
          HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL || 'https://${{ secrets.VERCEL_PROJECT_DOMAIN }}/api/health' }}
          RELIABILITY_ALERT_WEBHOOK: ${{ secrets.RELIABILITY_ALERT_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.check_only }}" == "true" ]; then
            pnpm run reliability:check
          elif [ "${{ github.event.inputs.no_prs }}" == "true" ]; then
            pnpm run reliability:dashboard
          else
            pnpm run reliability:orchestrate
          fi

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-reports
          path: |
            REPORTS/dependency-report.json
            REPORTS/cost_forecast.json
            REPORTS/reliability_trends.json
            compliance/audits/**/SECURITY_COMPLIANCE_REPORT.json
            apps/web/public/admin/reliability.json
            apps/web/public/admin/compliance.json
          retention-days: 30

      - name: Comment on PR (if PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              const reliabilityJson = fs.readFileSync('apps/web/public/admin/reliability.json', 'utf8');
              const reliability = JSON.parse(reliabilityJson);
              
              const comment = `## Reliability Orchestrator Report
              
              **Overall Status**: ${reliability.overall.status.toUpperCase()}
              **Score**: ${reliability.overall.score}/100
              
              ### Uptime
              - ${(reliability.uptime.percentage * 100).toFixed(3)}% (target: ${(reliability.uptime.target * 100).toFixed(2)}%)
              - Avg Latency: ${reliability.uptime.avgLatency}ms
              
              ### Dependencies
              - Outdated: ${reliability.dependencies.outdated}
              - Vulnerabilities: ${reliability.dependencies.vulnerabilities}
              
              ### Costs
              - Current: $${reliability.costs.current.toFixed(2)}/month
              - Forecasted: $${reliability.costs.forecasted.toFixed(2)}/month
              
              [View Full Dashboard](./apps/web/public/admin/reliability.json)
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Could not post comment:', error.message);
            }

      - name: Create Issue for Critical Alerts
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Reliability Orchestrator Failure',
              body: `The reliability orchestrator workflow failed. Please check the workflow logs for details.
              
              Workflow Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['reliability', 'critical']
            });
