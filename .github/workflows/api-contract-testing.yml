name: API Contract Testing

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/web/src/app/api/**'
      - 'packages/utils/src/api/**'
      - '.github/workflows/api-contract-testing.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/src/app/api/**'
      - 'packages/utils/src/api/**'

jobs:
  generate-openapi:
    name: Generate OpenAPI Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

            - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:

- name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI spec
        run: npx tsx scripts/generate-openapi-docs.ts

      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: docs/openapi.json
          retention-days: 30

      - name: Validate OpenAPI spec
        run: |
          # Install swagger-cli if not available
          if ! command -v swagger-cli &> /dev/null; then
            npm install -g @apidevtools/swagger-cli
          fi
          swagger-cli validate docs/openapi.json

  api-contract-tests:
    name: API Contract Tests
    runs-on: ubuntu-latest
    needs: generate-openapi
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download OpenAPI spec
        uses: actions/download-artifact@v4
        with:
          name: openapi-spec
          path: docs/

      - name: Run contract tests
        run: |
          # Run contract validation tests
          pnpm test packages/testing/contracts || true
          echo "✅ API contract tests completed"

  validate-dtos:
    name: Validate DTOs
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check DTOs
        run: |
          pnpm type-check --filter @whats-for-dinner/utils
          echo "✅ DTOs are type-safe"
