name: CI Metrics Tracking

on:
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 6 * * 1'  # weekly Mon 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  track-metrics:
    name: Track CI Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Track CI metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/ci-metrics-tracker.mjs --days=7

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics
          path: reports/ci-metrics/*.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Comment on PR (if applicable)
        if: github.event_name == 'workflow_dispatch' && github.event.pull_request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const metricsPath = 'reports/ci-metrics/metrics-*.json';
            // Read latest metrics and comment
            // Implementation depends on your needs
