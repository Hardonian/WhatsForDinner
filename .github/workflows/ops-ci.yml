# GitHub Actions - Full Matrix CI

name: Ops CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Daily synthetic monitor
    - cron: '0 * * * *' # Hourly
    # Weekly growth report
    - cron: '0 0 * * 1' # Monday
    # Monthly DR rehearsal
    - cron: '0 0 1 * *' # First of month

env:
  NODE_VERSION: '22'
  PNPM_VERSION: 9

jobs:
  # Matrix build for web/app/functions
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [web, mobile, functions]
    steps:
      - uses: actions/checkout@v7
      
            - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
      
- name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build packages
        run: pnpm build:packages
      
      - name: Build target
        run: |
          if [ "${{ matrix.target }}" == "web" ]; then
            pnpm build:web
          elif [ "${{ matrix.target }}" == "mobile" ]; then
            pnpm build:mobile
          else
            echo "Functions build"
          fi

  # Ops Doctor
  ops-doctor:
    name: Ops Doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run ops doctor
        run: pnpm ops doctor
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ops-reports
          path: ops/reports/

  # E2E Tests
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Install Playwright
        run: npx playwright install --with-deps
      
      - name: Run E2E tests
        run: pnpm ops test:e2e
        env:
          PROD_URL: ${{ secrets.PROD_URL || 'http://localhost:3000' }}
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/test-results/

  # Synthetic Monitor (Hourly)
  synthetic-monitor:
    name: Synthetic Monitor
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run synthetic monitor
        run: npx tsx tests/reality/synthetic-monitor.ts
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Performance Budgets
  performance:
    name: Performance Budgets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run Lighthouse CI
        run: pnpm ops performance lighthouse
      
      - name: Check budgets
        run: npx tsx ops/performance-budgets.ts check

  # RLS Guard
  rls-guard:
    name: RLS Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run RLS guard
        run: pnpm ops sb-guard
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # Weekly Growth Report
  growth-report:
    name: Growth Report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * 1'
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Generate growth report
        run: npx tsx ops/growth-engine.ts report
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      
      - name: Upload growth report
        uses: actions/upload-artifact@v4
        with:
          name: growth-report
          path: ops/reports/growth.*

  # Monthly DR Rehearsal
  dr-rehearsal:
    name: DR Rehearsal
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 1 * *'
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run DR rehearsal
        run: |
          echo "DR Rehearsal - See ops/runbooks/DR.md"
          # This would create temp env, restore snapshot, run smoke tests
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  # Documentation
  docs:
    name: Generate Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Generate docs
        run: pnpm ops docs
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ops/docs
