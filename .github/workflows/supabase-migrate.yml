name: Supabase Migrations

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Supabase Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: 'pnpm'

      - name: Login to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set. Please add it to GitHub Secrets."
            exit 1
          fi
          echo "Logging in to Supabase..."
          npx supabase@latest login --token "$SUPABASE_ACCESS_TOKEN"

      - name: Link to Supabase project
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_PROJECT_REF secret is not set. Please add it to GitHub Secrets."
            exit 1
          fi
          echo "Linking to Supabase project: $SUPABASE_PROJECT_REF"
          npx supabase@latest link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Run migrations
        working-directory: apps/web
        run: |
          set -euo pipefail
          echo "Applying pending migrations from apps/web/supabase/migrations..."
          # Ensure we're in the right directory with config.toml or link properly
          if [ -f "supabase/config.toml" ]; then
            npx supabase@latest migration up
          else
            # If no local config, use the migrations directory explicitly
            cd supabase && npx supabase@latest migration up --db-url "$DATABASE_URL" || {
              echo "::warning::Direct migration up failed, trying alternative method"
              npx supabase@latest db push
            }
          fi
          echo "✅ Migrations applied successfully"

      - name: Validate schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "Validating database schema..."
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret not set. Skipping schema validation."
            exit 0
          fi
          pnpm tsx scripts/db-validate-schema.ts || {
            echo "::error::Schema validation failed. Please check the database schema."
            exit 1
          }
          echo "✅ Schema validation passed"
